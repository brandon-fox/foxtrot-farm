# Runs every pre-commit hook. .pre-commit-config.yaml is the only definition of the checks.
# The daily run catches ruleset drift between commits (docs/decisions/0003-branch-protection.md).
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: pre-commit run ruleset-drift --hook-stage manual
        env:
          GH_TOKEN: ${{ github.token }}
