# Fails the build if any workflow uses an action that isn't pinned to a full commit SHA.
name: Action pins

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check every action is pinned to a commit SHA
        run: scripts/check-action-pins.sh
