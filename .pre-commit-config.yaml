# The only definition of this repo's checks. CI runs them all (.github/workflows/ci.yml).
# Setup once per clone: pip install -r requirements-dev.txt && pre-commit install
repos:
  # Third-party hooks are frozen to commit SHAs (same reason as ADR 0002). Bump with: pre-commit autoupdate --freeze
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "2", -ci]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: check-action-pins
        name: GitHub Actions pinned to commit SHAs
        entry: scripts/check-action-pins.sh
        language: script
        files: ^\.github/.*\.ya?ml$
      - id: unit-tests
        name: Unit tests
        entry: tests/check-action-pins.test.sh
        language: script
        pass_filenames: false
        files: ^(scripts|tests)/
      - id: mutation-tests
        name: Mutation tests
        entry: tests/mutation.sh
        language: script
        pass_filenames: false
        files: ^(scripts|tests)/
